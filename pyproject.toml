[project]
name = "osmnx-async"
dynamic = ["version"]
description = "Async alternatives to osmnx's IO-bound public API functions"
readme = "README.md"
authors = [
    { name = "Craig McConomy", email = "cmcconomy@fwig.com" },
]
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.0,<3.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/osmnx_async/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real network requests comparing sync vs async results",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "TCH"]
